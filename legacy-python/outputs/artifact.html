<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFL 2026 finals — live projection</title>
<style>
:root{color-scheme:light;--ink:#16181d;--muted:#6b7280;--line:#e4e6eb;--accent:#0b6fb0;
--warm:#c0392b;--good:#1e8449;--bg:#fbfbfd;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 64px}
h1{font-size:27px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:20px 22px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.note{color:var(--muted);font-size:13px;margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:7px 15px;border-radius:999px;border:1px solid var(--line);
background:#fff;cursor:pointer;font-size:14px;color:var(--muted)}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;
border-bottom:1px solid #f1f2f5}
.row:last-child{border-bottom:0}
.nm{width:170px;font-weight:600;font-size:14px;flex:none}
.barwrap{flex:1;background:#f0f2f6;border-radius:5px;height:22px;
position:relative;overflow:hidden}
.bar{height:100%;background:var(--accent);border-radius:5px}
.val{width:56px;text-align:right;font-variant-numeric:tabular-nums;
font-weight:700;font-size:14px;flex:none}
.freq{width:190px;color:var(--muted);font-size:12.5px;flex:none}
.out{opacity:.4}
.match{display:flex;justify-content:space-between;align-items:center;
padding:11px 0;border-bottom:1px solid #f1f2f5;gap:14px;flex-wrap:wrap}
.match:last-child{border-bottom:0}
.mt{font-size:12px;color:var(--muted);text-transform:uppercase;
letter-spacing:.05em}
.score{font-variant-numeric:tabular-nums;font-weight:700}
.win{color:var(--good)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;
background:#eef4f9;color:var(--accent);font-size:12.5px;font-weight:600}
.kpi{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 0}
.kpi div{min-width:120px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:12.5px}
.warn{background:#fff8f0;border-color:#f0d9bd}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid #f1f2f5}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
letter-spacing:.04em}
td.n{text-align:right;font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.7}
</style>
</head>
<body>
<div class=wrap>
<h1>AFL 2026 finals</h1>
<p class=sub id=sub></p>
<div class=tabs role=tablist>
  <button class=tab role=tab data-v=fans aria-selected=true>For fans</button>
  <button class=tab role=tab data-v=clubs aria-selected=false>For clubs</button>
  <button class=tab role=tab data-v=model aria-selected=false>How it works</button>
</div>
<div id=view></div>
<footer id=foot></footer>
</div>
<script>
const D = {"generated":"4 September 2026, 2:09am AEST","season":2026,"sigma":33.2,"hga":{"base":2.53,"interstate":6.25,"tz":1.25},"drift":9.72,"teams":[{"team":"Hawthorn","ladder_pos":4,"rating":13.5,"pts":64,"percentage":120.1,"p_premier":0.2914,"p_grand_final":0.5334,"p_prelim":1.0,"p_finals":1.0,"freq":"about 3 Septembers in 10"},{"team":"Sydney","ladder_pos":2,"rating":20.5,"pts":72,"percentage":136.1,"p_premier":0.271,"p_grand_final":0.539,"p_prelim":0.8834,"p_finals":1.0,"freq":"about 3 Septembers in 10"},{"team":"Brisbane Lions","ladder_pos":3,"rating":16.6,"pts":64,"percentage":121.7,"p_premier":0.1845,"p_grand_final":0.3927,"p_prelim":0.7615,"p_finals":1.0,"freq":"about 2 Septembers in 10"},{"team":"Fremantle","ladder_pos":1,"rating":20.2,"pts":76,"percentage":137.2,"p_premier":0.1201,"p_grand_final":0.2768,"p_prelim":0.7298,"p_finals":1.0,"freq":"about 1 September in 10"},{"team":"Geelong","ladder_pos":5,"rating":18.7,"pts":60,"percentage":122.3,"p_premier":0.0941,"p_grand_final":0.1549,"p_prelim":0.2936,"p_finals":1.0,"freq":"about 1 September in 11"},{"team":"Adelaide","ladder_pos":6,"rating":13.1,"pts":60,"percentage":117.3,"p_premier":0.0247,"p_grand_final":0.0672,"p_prelim":0.2083,"p_finals":1.0,"freq":"about 1 September in 41"},{"team":"Carlton","ladder_pos":10,"rating":1.2,"pts":50,"percentage":101.5,"p_premier":0.0085,"p_grand_final":0.0204,"p_prelim":0.0615,"p_finals":1.0,"freq":"about 1 September in 117"},{"team":"Western Bulldogs","ladder_pos":8,"rating":4.4,"pts":54,"percentage":95.4,"p_premier":0.0056,"p_grand_final":0.0157,"p_prelim":0.062,"p_finals":1.0,"freq":"about 1 September in 178"},{"team":"Melbourne","ladder_pos":7,"rating":4.8,"pts":60,"percentage":109.6,"p_premier":0.0,"p_grand_final":0.0,"p_prelim":0.0,"p_finals":0.0,"freq":"out"},{"team":"Collingwood","ladder_pos":9,"rating":4.9,"pts":52,"percentage":102.4,"p_premier":0.0,"p_grand_final":0.0,"p_prelim":0.0,"p_finals":0.0,"freq":"out"}],"played":[{"stage":"Wildcard Final","venue":"M.C.G.","date":"2026-08-28","home":"Western Bulldogs","away":"Collingwood","home_score":96,"away_score":93,"winner":"Western Bulldogs","margin":3,"home_shots":26,"away_shots":23},{"stage":"Wildcard Final","venue":"M.C.G.","date":"2026-08-29","home":"Melbourne","away":"Carlton","home_score":55,"away_score":74,"winner":"Carlton","margin":19,"home_shots":20,"away_shots":24},{"stage":"Qualifying Final","venue":"Perth Stadium","date":"2026-09-03","home":"Fremantle","away":"Hawthorn","home_score":40,"away_score":72,"winner":"Hawthorn","margin":32,"home_shots":15,"away_shots":22}],"upcoming":[{"stage":"Elimination Final","home":"Geelong","away":"Carlton","venue":"M.C.G.","exp_margin":20.0,"p_home":0.727},{"stage":"Qualifying Final","home":"Sydney","away":"Brisbane Lions","venue":"S.C.G.","exp_margin":12.7,"p_home":0.649},{"stage":"Elimination Final","home":"Adelaide","away":"Western Bulldogs","venue":"Adelaide Oval","exp_margin":18.2,"p_home":0.708}],"shots":{"Fremantle":{"team":"Fremantle","accuracy":0.5304,"shots_for":27.2,"shots_against":20.7,"shot_diff":6.5},"Sydney":{"team":"Sydney","accuracy":0.5614,"shots_for":29.0,"shots_against":23.7,"shot_diff":5.4},"Brisbane Lions":{"team":"Brisbane Lions","accuracy":0.5471,"shots_for":29.1,"shots_against":24.3,"shot_diff":4.8},"Hawthorn":{"team":"Hawthorn","accuracy":0.5232,"shots_for":27.2,"shots_against":22.0,"shot_diff":5.2},"Geelong":{"team":"Geelong","accuracy":0.5536,"shots_for":27.2,"shots_against":23.3,"shot_diff":3.9},"Adelaide":{"team":"Adelaide","accuracy":0.576,"shots_for":24.3,"shots_against":23.0,"shot_diff":1.3},"Melbourne":{"team":"Melbourne","accuracy":0.5594,"shots_for":26.3,"shots_against":23.9,"shot_diff":2.5},"Western Bulldogs":{"team":"Western Bulldogs","accuracy":0.5228,"shots_for":22.9,"shots_against":25.1,"shot_diff":-2.2},"Collingwood":{"team":"Collingwood","accuracy":0.527,"shots_for":24.2,"shots_against":23.4,"shot_diff":0.7},"Carlton":{"team":"Carlton","accuracy":0.5142,"shots_for":24.4,"shots_against":23.4,"shot_diff":1.0},"St Kilda":{"team":"St Kilda","accuracy":0.5186,"shots_for":24.6,"shots_against":24.1,"shot_diff":0.5},"Greater Western Sydney":{"team":"Greater Western Sydney","accuracy":0.5236,"shots_for":24.9,"shots_against":24.6,"shot_diff":0.3},"Gold Coast":{"team":"Gold Coast","accuracy":0.5234,"shots_for":24.2,"shots_against":25.3,"shot_diff":-1.2},"North Melbourne":{"team":"North Melbourne","accuracy":0.5263,"shots_for":23.1,"shots_against":26.1,"shot_diff":-3.0},"Port Adelaide":{"team":"Port Adelaide","accuracy":0.483,"shots_for":23.0,"shots_against":23.8,"shot_diff":-0.9},"West Coast":{"team":"West Coast","accuracy":0.466,"shots_for":21.1,"shots_against":27.1,"shot_diff":-6.0},"Richmond":{"team":"Richmond","accuracy":0.4772,"shots_for":19.0,"shots_against":28.8,"shot_diff":-9.8},"Essendon":{"team":"Essendon","accuracy":0.5022,"shots_for":19.8,"shots_against":29.0,"shot_diff":-9.2}},"skill_vs_uniform":0.016};
const pct = p => (p*100).toFixed(p<0.1?1:0)+"%";
const el = (h) => { const d=document.createElement("div"); d.innerHTML=h;
  return d.firstElementChild; };

function oddsRows(key, showFreq){
  const live = D.teams.filter(t=>t.p_premier>0)
    .sort((a,b)=>b[key]-a[key]);
  const dead = D.teams.filter(t=>t.p_premier<=0);
  const max = Math.max(...live.map(t=>t[key]));
  return live.map(t=>`<div class=row>
    <div class=nm>${t.team}</div>
    <div class=barwrap><div class=bar style="width:${100*t[key]/max}%"></div></div>
    <div class=val>${pct(t[key])}</div>
    ${showFreq?`<div class=freq>${t.freq}</div>`:""}
  </div>`).join("") + dead.map(t=>`<div class="row out">
    <div class=nm>${t.team}</div>
    <div class=barwrap></div><div class=val>out</div>
    ${showFreq?`<div class=freq>eliminated</div>`:""}</div>`).join("");
}

function played(){
  return D.played.map(m=>`<div class=match>
    <div><div class=mt>${m.stage} &middot; ${m.venue}</div>
      <span class="${m.winner===m.home?'win':''}">${m.home}</span>
      <span class=score>${m.home_score}</span> &ndash;
      <span class=score>${m.away_score}</span>
      <span class="${m.winner===m.away?'win':''}">${m.away}</span></div>
    <div class=mt>${m.winner} by ${m.margin}</div></div>`).join("");
}

function upcoming(){
  if(!D.upcoming.length) return "<p class=note>No scheduled matches left to price.</p>";
  return D.upcoming.map(m=>`<div class=match>
    <div><div class=mt>${m.stage} &middot; ${m.venue}</div>
      <b>${m.home}</b> v ${m.away}</div>
    <div><span class=pill>${m.home} ${pct(m.p_home)}</span>
      <span class=mt style="margin-left:8px">by ${Math.abs(m.exp_margin)} pts</span></div>
  </div>`).join("");
}

const VIEWS = {
fans: () => `
<div class=card><h2>Who wins the flag?</h2>
<p class=note>Out of every 100 times this September could play out, this is how
often each side lifts the cup. Matches already played are locked in.</p>
${oddsRows("p_premier", true)}</div>

<div class="card warn"><h2>Read this before you argue with it</h2>
<p class=note style="margin:0">No side is even a one-in-three chance. That is
not the model hedging &mdash; a flag means winning four knockout games, and a
typical final is decided by far more randomness than the ladder suggests.
Tested against the last ten seasons, this model beats a blind
one-in-eight guess by only a hair. Treat every number here as "roughly", and
treat anyone quoting AFL premiership odds to one decimal place with suspicion.</p></div>

<div class=card><h2>Results so far</h2>${played()}</div>
<div class=card><h2>Next up</h2>
<p class=note>Chance the home side wins, and the margin we expect.</p>
${upcoming()}</div>`,

clubs: () => `
<div class=card><h2>Where each side actually is</h2>
<p class=note>Rating is points better or worse than an average team, weighted
towards recent form and adjusted for who they played and where.</p>
<table><thead><tr><th>#</th><th>Team</th><th class=n>Rating</th>
<th class=n>Shots/gm</th><th class=n>Conceded</th><th class=n>Accuracy</th>
<th class=n>Prelim</th><th class=n>Flag</th></tr></thead><tbody>
${D.teams.map(t=>{const s=D.shots[t.team]||{};return `<tr${t.p_premier<=0?' class=out':''}>
<td>${t.ladder_pos}</td><td><b>${t.team}</b></td>
<td class=n>${t.rating>0?"+":""}${t.rating}</td>
<td class=n>${s.shots_for??"&mdash;"}</td>
<td class=n>${s.shots_against??"&mdash;"}</td>
<td class=n>${s.accuracy?pct(s.accuracy):"&mdash;"}</td>
<td class=n>${pct(t.p_prelim)}</td>
<td class=n><b>${pct(t.p_premier)}</b></td></tr>`}).join("")}
</tbody></table></div>

<div class=card><h2>Why we don't rank you on accuracy</h2>
<p class=note style="margin:0">Across 216 team-seasons, only about a third of
the spread in goal accuracy repeats from one half of a season to the other
&mdash; the rest is noise. Scoring shots created and conceded repeat at nearly
0.9. So if your accuracy column looks bad, most of it is likely to correct
itself; if your shots-conceded column looks bad, it probably will not.</p></div>`,

model: () => `
<div class=card><h2>The short version</h2>
<p class=note>Every team gets a rating in points from 12 seasons of results,
weighted heavily towards this year. Ratings plus home ground give an expected
margin for any fixture; that becomes a win probability; the bracket is then
played out ${(50000).toLocaleString()} times.</p>
<div class=kpi>
<div><b>&plusmn;${D.sigma}</b><span>typical error on a single match, points</span></div>
<div><b>+${D.hga.base}</b><span>home ground, no travel</span></div>
<div><b>+${(D.hga.base+D.hga.interstate+2*D.hga.tz).toFixed(1)}</b><span>home ground in Perth v a Victorian side</span></div>
<div><b>${D.drift}</b><span>how much a side's true strength drifts in a year, points</span></div>
</div></div>

<div class=card><h2>What we checked, and what failed</h2>
<table><thead><tr><th>Claim</th><th>Verdict</th></tr></thead><tbody>
<tr><td>Goal accuracy is mostly luck</td><td class=win>Held &mdash; reliability 0.32</td></tr>
<tr><td>Scoring shots are repeatable skill</td><td class=win>Held &mdash; reliability 0.88</td></tr>
<tr><td>So shot differential should out-predict points differential</td>
<td style="color:var(--warm)">Failed &mdash; identical (p = 0.54)</td></tr>
<tr><td>Home advantage must vary by venue to predict well</td>
<td style="color:var(--warm)">Failed &mdash; a single number predicts just as well</td></tr>
<tr><td>The bracket engine beats a naive baseline</td>
<td class=win>Held, barely &mdash; Brier skill +${D.skill_vs_uniform}</td></tr>
</tbody></table></div>

<div class="card warn"><h2>The 2026 format has never been played</h2>
<p class=note style="margin:0">Ten finalists and a wildcard round is new this
year, so there is no history to test the bracket against. The engine is instead
validated on 2015&ndash;2025 under the old eight-team format, and the new
structure is checked against rules that must hold in any correct bracket
&mdash; premiership chances summing to one, grand finalists to two, wildcard
sides claiming exactly two of the eight places. All pass.</p></div>`,
};

function render(v){
  document.getElementById("view").innerHTML = VIEWS[v]();
  document.querySelectorAll(".tab").forEach(b=>
    b.setAttribute("aria-selected", b.dataset.v===v));
}
document.querySelectorAll(".tab").forEach(b=>
  b.onclick=()=>render(b.dataset.v));
document.getElementById("sub").textContent =
  `Live projection · ${D.played.length} finals played, `+
  `${D.upcoming.length} priced · updated ${D.generated}`;
document.getElementById("foot").innerHTML =
  "Match data: Squiggle API. Model and write-up: this repository. "+
  "Ratings are ridge-penalised least squares on match margins; the finals are "+
  "a Monte Carlo over the bracket. <b>Nothing here is betting advice</b> "+
  "&mdash; the model barely beats a coin jar, which is rather the point.";
render("fans");
</script>
</body>
</html>
